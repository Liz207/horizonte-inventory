{% extends "base.html" %}
{% block title %}Error {{ codigo }} | Horizonte Inventory{% endblock %}

{% block contenido %}
<section class="error">
  <p class="error__codigo">{{ codigo }}</p>
  <h1 class="titulo">{{ mensaje }}</h1>
  <p class="tenue">El detalle quedo registrado en logs/application.log.</p>
  <a class="boton boton--principal" href="{{ url_for('inventario') }}">Volver al inventario</a>
</section>
{% endblock %}
